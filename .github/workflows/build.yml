name: Build piano Ubuntu GNOME Android boot and rootfs
on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: Root filesystem image size
        required: true
        default: '12G'
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex clang lld llvm libssl-dev libelf-dev cpio kmod git tar gzip
      - name: Extract validated build sources
        run: mkdir v3 && tar -xzf repo-v3-new.tar.gz -C v3
      - name: Build pinned piano kernel and DTB
        run: bash v3/scripts/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: piano-kernel-7.1.3-469998695964
          path: v3/kernel-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  boot:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android boot packer
        run: mkdir v3 && tar -xzf repo-v3-new.tar.gz -C v3
      - uses: actions/download-artifact@v4
        with:
          name: piano-kernel-7.1.3-469998695964
          path: v3/kernel-artifacts/
      - name: Build Android boot v2 with separate piano DTB
        run: |
          python3 v3/mkbootimg --kernel v3/kernel-artifacts/Image.gz --dtb v3/kernel-artifacts/piano.dtb --cmdline 'root=LABEL=linux rw rootwait' --base 0x00000000 --kernel_offset 0x00008000 --tags_offset 0x01e00000 --dtb_offset 0x01f00000 --pagesize 4096 --header_version 2 --id -o boot.img
          sha256sum boot.img v3/kernel-artifacts/Image.gz v3/kernel-artifacts/piano.dtb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: piano-android-boot-v2
          path: |
            boot.img
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  rootfs:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Extract validated build sources
        run: mkdir v3 && tar -xzf repo-v3-new.tar.gz -C v3
      - uses: actions/download-artifact@v4
        with:
          name: piano-kernel-7.1.3-469998695964
          path: v3/kernel-artifacts/
      - name: Extract verified device firmware stage
        run: mkdir v3/piano-firmware-stage && tar -xJf piano-firmware-stage.tar.xz -C v3/piano-firmware-stage
      - name: Install rootfs tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap ubuntu-keyring ca-certificates e2fsprogs kmod zstd python3 tar gzip util-linux
      - name: Build authenticated GNOME rootfs and initramfs
        env:
          ROOTFS_SIZE: ${{ inputs.rootfs_size }}
          FIRMWARE_STAGE: v3/piano-firmware-stage
        run: sudo --preserve-env=ROOTFS_SIZE,FIRMWARE_STAGE bash v3/scripts/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: piano-ubuntu-24.04-gnome-rootfs
          path: v3/rootfs-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
