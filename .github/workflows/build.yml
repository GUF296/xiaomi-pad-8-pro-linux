name: piano Ubuntu GNOME build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y bc bison flex clang lld llvm cpio e2fsprogs qemu-user-static zstd git curl
      - name: kernel
        run: |
          git clone --depth=1 --branch full-v7.1.3 https://github.com/BigfootACA/linux.git linux
          make -C linux O=$PWD/out ARCH=arm64 LLVM=1 defconfig
          cp piano.config out/.config
          make -C linux O=$PWD/out ARCH=arm64 LLVM=1 olddefconfig
          make -C linux O=$PWD/out ARCH=arm64 LLVM=1 -j$(nproc) Image.gz dtbs modules
          make -C linux O=$PWD/out ARCH=arm64 LLVM=1 INSTALL_MOD_PATH=$PWD/mods modules_install
          cp out/arch/arm64/boot/Image.gz .
          cp out/arch/arm64/boot/dts/qcom/sm8750-xiaomi-piano.dtb piano.dtb
      - name: rootfs
        run: |
          mkdir r
          curl -fL https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64-root.tar.xz -o r.tar.xz
          sudo tar -xpf r.tar.xz -C r
          sudo cp -a mods/lib/modules r/usr/lib/
          sudo cp piano.dtb r/boot/
          sudo chroot r /bin/bash -c 'apt-get update && apt-get install -y gnome-shell gnome-session gnome-terminal gnome-control-center gnome-keyring nautilus gdm3 network-manager xdg-desktop-portal-gnome && apt-get clean'
          truncate -s 12G rootfs.img
          sudo mkfs.ext4 -F -L linux -d r rootfs.img
          sudo e2fsck -fy rootfs.img
      - name: boot
        run: |
          curl -fL https://raw.githubusercontent.com/code002-2/ubuntu-sheng/main/mkbootimg -o mkbootimg
          chmod +x mkbootimg
          cat Image.gz piano.dtb > Image.gz-dtb-piano
          ./mkbootimg --kernel Image.gz-dtb-piano --cmdline 'root=PARTLABEL=linux rw' --pagesize 4096 --header_version 2 --id -o boot.img
          sha256sum rootfs.img boot.img piano.dtb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: piano-ubuntu-gnome
          path: |
            rootfs.img
            boot.img
            piano.dtb
            SHA256SUMS
