name: Build piano Ubuntu GNOME artifacts
on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: Root filesystem image size
        required: true
        default: '12G'
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Extract validated build sources
        run: mkdir v3 && tar -xzf repo-v3.tar.gz -C v3
      - name: Build pinned piano kernel and DTB
        run: bash v3/scripts/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: piano-kernel-7.1.3-469998695964
          path: v3/kernel-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  rootfs:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Extract validated build sources
        run: mkdir v3 && tar -xzf repo-v3.tar.gz -C v3
      - uses: actions/download-artifact@v4
        with:
          name: piano-kernel-7.1.3-469998695964
          path: v3/kernel-artifacts/
      - name: Extract verified device firmware stage
        run: mkdir v3/firmware-stage && tar -xJf piano-firmware-stage.tar.xz -C v3/firmware-stage
      - name: Install rootfs tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap ubuntu-keyring ca-certificates e2fsprogs kmod zstd python3 tar gzip util-linux
      - name: Build authenticated GNOME rootfs and initramfs
        env:
          ROOTFS_SIZE: ${{ inputs.rootfs_size }}
          FIRMWARE_STAGE: v3/firmware-stage
        run: sudo --preserve-env=ROOTFS_SIZE,FIRMWARE_STAGE bash v3/scripts/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: piano-ubuntu-24.04-gnome-rootfs
          path: v3/rootfs-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
