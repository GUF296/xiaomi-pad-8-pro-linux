name: Build independent piano UFS-LUN0 debug boot image

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful run containing piano-android-boot-v2 and matching kernel artifacts
        required: true
        default: '36784975954'
        type: string
      android_boot_artifact:
        description: Existing Android boot image artifact name
        required: true
        default: piano-android-boot-v2
        type: string
      kernel_artifact:
        description: Matching piano kernel artifact name
        required: true
        default: piano-kernel-7.1.3-469998695964
        type: string
      mass_storage_ro:
        description: Export UFS LUN0 read-only; false (default) enables controlled read/write debug access
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  debug-boot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Download the original Android boot image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.android_boot_artifact }}
          path: debug-android/
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download the matching piano kernel modules
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kernel_artifact }}
          path: debug-kernel/
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Normalize compressed kernel artifact layout
        shell: bash
        run: |
          set -Eeuo pipefail
          kr="$(find debug-kernel -type f -name kernelrelease -print -quit)"
          test -n "$kr"
          kd="$(dirname "$kr")"
          if test -f "$kd/Image.gz" && test ! -e "$kd/Image"; then cp "$kd/Image.gz" "$kd/Image"; fi
      - name: Install initramfs and Android image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip kmod initramfs-tools-core python3
      - name: Patch builder for matching Linux kernel
        run: |
          python3 - <<'PY'
          import re
          p = 'scripts/build-debug-mass-storage-v2.sh'
          s = open(p).read()
          s = s.replace('if [[ -x "$ROOT_DIR/mkbootimg" ]]; then', 'if [[ -f "$ROOT_DIR/mkbootimg" ]]; then')
          s = re.sub(r'cmp -s .*?die "Android boot kernel does not match downloaded kernel artifact \$\(basename "\$KERNEL_PAYLOAD"\)"', 'cp "\$KERNEL_PAYLOAD" "\$OUTPUT_DIR/work/android/kernel"\nif [[ -s "\$KERNEL_DIR/piano.dtb" ]]; then cp "\$KERNEL_DIR/piano.dtb" "\$OUTPUT_DIR/work/android/dtb"; fi', s, count=1, flags=re.S)
          open(p, 'w').write(s)
          PY
      - name: Make bundled mkbootimg executable
        run: chmod +x mkbootimg
      - name: Replace only the ramdisk with the UFS-LUN0 debug hook
        env:
          ANDROID_BOOT_DIR: ${{ github.workspace }}/debug-android
          KERNEL_DIR: ${{ github.workspace }}/debug-kernel
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          MASS_STORAGE_RO: ${{ inputs.mass_storage_ro && '1' || '0' }}
        run: |
          sudo --preserve-env=ANDROID_BOOT_DIR,KERNEL_DIR,SOURCE_RUN_ID,MASS_STORAGE_RO,HOME bash scripts/build-debug-mass-storage-v2.sh
      - name: Publish the complete Android debug boot image
        uses: actions/upload-artifact@v4
        with:
          name: piano-usb-lun0-debug-boot
          path: debug-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
